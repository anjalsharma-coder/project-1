<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="hello"></p>

    <script>
        var obj = {name:"Anjal", age: 16, year: 12 };
        var JSON1 = JSON.stringify(obj); 
        var nobj = JSON.parse(JSON1);
        document.getElementById("hello").innerHTML = nobj.year;

    </script>
</body>
</html>
