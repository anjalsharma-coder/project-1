<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Document</title>
</head>

<body>
    <div class="container mt-4">
        <h3>Carousel Image</h3>
        <div id="imagecarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-indicators">
                <button data-bs-target="#imagecarousel" data-bs-slide-to="0" class="active"></button>
                <button data-bs-target="#imagecarousel" data-bs-slide-to="1"></button>
                <button data-bs-target="#imagecarousel" data-bs-slide-to="2"></button>
                <button data-bs-target="#imagecarousel" data-bs-slide-to="3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="https://picsum.photos/800/400?random=1" class="d-block w-100" alt="image 1">
                    </div>
                    <div class="carousel-item">
                    <img src="https://picsum.photos/800/400?random=2" class="d-block w-100" alt="image 2">
                    </div>
                    <div class="carousel-item" >
                    <img src="https://picsum.photos/800/400?random=3" class="d-block w-100" alt="image 3">
                    </div>
                    <div class="carousel-item">
                    <img src="https://picsum.photos/800/400?random=4" class="d-block w-100" alt="image 4">
                    </div>

                <button class="carousel-control-prev" data-bs-target="#imagecarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button class="carousel-control-next" data-bs-target="#imagecarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
