<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .fixed{
            position: fixed;
            top: 2000px;
            left: 250px;
            border: 5px solid;
        }
        .static{ 
            border: 5px solid;
        }
        .relative{
            position:relative;
            left: 100px;
            top: 50px;
            border: 5px solid rgb(56, 143, 56);
        }
        .absolute{
            position: absolute;
            left:150px;
            top: 50px;
            border: 5px solid rgb(72, 206, 72);
        }
        .sticky{
            position: sticky;
            left: 100px;
            top: 20px;
            border: 5px solid rgb(72, 206, 72);
        }
    </style>
</head>
<body>
    <div class="fixed">
    This is a fixed property element.
    </div>

    <div class="static">
    This is a static property element.
    </div>

    <div class=" relative">
        This is a relative tag property
        <div class="absolute">
            This is an absolute tag property
        </div>
    </div>

    <div class="sticky">
        This is a sticky tag property
    </div>

    <h1>Bottom of the page</h1>
</body>
</html>
