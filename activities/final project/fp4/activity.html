<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator </title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="calculator.css">
</head>

<body>
    <div class="container" id="main">

        <div id="maincalculator">
            <div id="maincalculator2">
                <div id="display">
                    <h1 style="margin-left: 50px; color: rgb(161, 224, 203);">Enter the value</h1>
                </div>
                <div id="mainbutton">
                    <center>
                        <button type="button" id="number">Ac</button>
                        <button type="button" id="number">C</button>
                        <button type="button" id="number">%</button>
                        <button type="button" id="number">√</button>

                        <button type="button" id="number">7</button>
                        <button type="button" id="number">8</button>
                        <button type="button" id="number">9</button>
                        <button type="button" id="number">÷</button>

                        <button type="button" id="number">4</button>
                        <button type="button" id="number">5</button>
                        <button type="button" id="number">6</button>
                        <button type="button" id="number">X</button>

                        <button type="button" id="number">1</button>
                        <button type="button" id="number">2</button>
                        <button type="button" id="number">3</button>
                        <button type="button" id="number">-</button>
                        <button type="button" id="number">0</button>
                        <button type="button" id="number">.</button>
                        <button type="button" id="number">=</button>
                        <button type="button" id="number">+</button>
                    </center>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
