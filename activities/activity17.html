<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Transform</title>
    <style>
        .transform {
            transform: rotateX(180deg);
            color:antiquewhite;
            background-color: green;
            height: 200px;
        }
        .transform2{
            transform: rotate(270deg);
            color: rgb(217, 170, 108);
        

        }
    </style>
</head>
<body>
<div class="transform"> This method is called Transform method.</div>
<br><br><br>
<div class="transform2"> This method is called Transform method.</div>
</body>
</html>
