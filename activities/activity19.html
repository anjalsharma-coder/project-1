<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text shadow, Box shadow and text indent</title>
<style>
    .text{
            text-shadow: 9px, 4px, 2px, blanchedalmond;
    }
    #indent{
              text-indent: 20%;
    }
    .box{
            box-shadow: 9px, 9px, 9px, blanchedalmond;
    }
</style>

</head>
<body>
    <h1 class="text"> Text-shadow idea</h1>
    <div id="indent"> Text indent idea</div>
    <h3 class="box"> Box-shadow idea</h3>
</body>
</html>
