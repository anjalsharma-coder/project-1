<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <p id="loop"></p>

    <script>
        let i = 0;
        while (i <= 25) {
            let random = Math.floor(Math.random() * 100);
        document.getElementById("loop").innerHTML+= random + "<br>"+ i++; + "<br>"
        }
    </script>
</body>
</html>
