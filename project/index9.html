<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text effects</title>
    <style>
        #typo{
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            text-decoration: underline;
            text-transform: capitalize;
        }
        #shadow{
                box-shadow: 9px 9px 9px black;
        }
        .transform{
            transform: rotateX(180deg);
            text-shadow: 5px 3px 3px  black;
        }
    </style>
</head>
<body>
<h3 id="typo">Hello, my name is Angel</h3>
<h5 class="transform"> Hello, <br> My <br> name <br> is <br> Angel</h5>
<h2 id="shadow"> Box shadow is a good idea </h2>
</body>
</html>
