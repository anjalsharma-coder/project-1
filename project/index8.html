<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascadind effects</title>
    <style>
         body{
            background-color: rgb(239, 234, 105);
            background-image: url("download.jpeg");
            background-repeat: repeat;
            background-attachment: fixed;
         }

        div {
            width: 100px;
            height: 100px;
            background-color: rgb(210, 195, 144);
            animation-name: initial;
            animation-duration: 5s;
        }
        .linear { 
            background: linear-gradient(to top right, pink 50%, green);
        height: 200px;
        width: 200px;
    };
    #grad1 {
            height: 200px;
            width: 200px;
            background: radial-gradient(circle center,  blue 40%, yellow); 
        }
    </style>
</head>
<body>

<div class="linear"> CODINGAL GIVES US BEST LESSONS OF CODING</div>
<br><br><br>
<div class="animation">
        Hi, This is the website developer.
    </div>
<br><br><br>
<div id="grad1"> Hi, radial here !!</div>
</body>
</html>
